<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK标准教程5 · Bài 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F5F5;
    --teal:#76ABAE;
    --teal-dark:#4b7f82;
    --teal-soft:#E6F0F0;
    --ink:#303841;
    --ink-soft:#5C6672;
    --flame:#FF5722;
    --flame-soft:#FFE7DC;
    --ok:#3FA66B;
    --ok-soft:#E6F6EC;
    --white:#FFFFFF;
    --radius-lg:22px;
    --radius-md:14px;
    --shadow:0 10px 30px -14px rgba(48,56,65,0.28);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Be Vietnam Pro', sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--flame); color:#fff;}
  .hanzi{font-family:'Noto Serif SC', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  h1,h2,h3,h4{font-family:'Baloo 2', sans-serif;}

  /* ---------- Header ---------- */
  header.top{padding:26px 24px 0; max-width:1240px; margin:0 auto;}
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;}
  .brand-mark{width:44px; height:44px; border-radius:13px; background:linear-gradient(145deg, var(--flame), #ff8a50); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Noto Sans SC'; font-weight:700; font-size:20px; box-shadow:0 8px 18px -6px rgba(255,87,34,.55); flex-shrink:0;}
  .brand-text .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .brand-text h1{margin:0; font-size:22px; font-weight:700;}
  .lesson-pill{display:flex; align-items:center; gap:9px; background:var(--ink); color:#fff; padding:9px 16px 9px 10px; border-radius:100px; font-weight:600; font-size:14.5px;}
  .lesson-pill span.num{background:var(--flame); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-family:'Baloo 2';}

  .bai-banner{margin-top:22px; display:flex; align-items:center; gap:22px; background:linear-gradient(120deg, var(--ink) 0%, #3c4653 100%); border-radius:var(--radius-lg); padding:24px 28px; color:#fff; position:relative; overflow:hidden;}
  .bai-banner::after{content:var(--bb-char,"汉"); position:absolute; right:20px; top:50%; transform:translateY(-50%); font-family:'Noto Serif SC'; font-size:100px; font-weight:700; color:rgba(255,255,255,.06);}
  .bai-banner .bb-num{font-family:'Baloo 2'; font-size:64px; font-weight:800; line-height:1; flex-shrink:0; color:var(--teal);}
  .bai-banner .bb-tag{font-size:13px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--teal); margin-bottom:6px;}
  .bai-banner .bb-title{font-family:'Noto Serif SC'; font-size:28px; font-weight:700; margin:0 0 6px; line-height:1.3; color:#fff;}
  .bai-banner .bb-scene{font-size:15px; line-height:1.6; color:rgba(255,255,255,.85); margin:0;}
  @media (max-width:640px){ .bai-banner{flex-direction:column; align-items:flex-start; gap:10px;} .bai-banner .bb-num{font-size:48px;} }

  nav.course-tabs{margin-top:26px; display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; border-bottom:1px solid rgba(48,56,65,.10);}
  nav.course-tabs::-webkit-scrollbar{display:none;}
  .ctab{position:relative; flex:0 0 auto; padding:12px 18px 14px; font-size:14.5px; font-weight:600; color:var(--ink-soft); background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:7px; transition:color .25s var(--ease); white-space:nowrap; font-family:inherit;}
  .ctab .dot{width:6px;height:6px;border-radius:50%; background:currentColor; opacity:.35; transition:.25s;}
  .ctab:hover{color:var(--ink);}
  .ctab.active{color:var(--flame);}
  .ctab.active .dot{background:var(--flame); opacity:1; transform:scale(1.4);}
  .ctab .bar{position:absolute; left:14px; right:14px; bottom:-1px; height:3px; background:var(--flame); border-radius:4px 4px 0 0; transform:scaleX(0); transition:transform .35s var(--ease);}
  .ctab.active .bar{transform:scaleX(1);}

  /* ---------- Layout ---------- */
  .app{max-width:1240px; margin:0 auto; padding:0 24px 80px;}
  .layout{display:grid; grid-template-columns:184px 1fr; gap:26px; margin-top:26px; align-items:start;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} .app{padding:0 16px 60px;} header.top{padding:20px 16px 0;} }
  .sidebar{background:var(--white); border-radius:var(--radius-lg); padding:14px; box-shadow:var(--shadow); position:sticky; top:20px;}
  @media (max-width:820px){ .sidebar{position:static; display:flex; gap:8px; overflow-x:auto; padding:12px;} .side-label{display:none;} #baiList{display:flex; gap:6px;} }
  .side-label{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); font-weight:700; padding:6px 10px 10px;}
  .bai-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 12px; border-radius:12px; border:none; background:none; font-size:14.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:background .22s var(--ease), color .22s var(--ease), transform .22s var(--ease); margin-bottom:2px; flex:0 0 auto; text-decoration:none; font-family:inherit;}
  .bai-item .idx{width:26px; height:26px; border-radius:9px; background:var(--teal-soft); color:var(--teal); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-size:12.5px; font-weight:700; flex-shrink:0;}
  .bai-item:not(.locked):not(.active):hover{background:var(--flame-soft); color:var(--flame); transform:translateX(2px);}
  .bai-item.active{background:var(--ink); color:#fff;}
  .bai-item.active .idx{background:var(--flame); color:#fff;}
  .bai-item.locked{color:#C3C9CE; cursor:default;}
  .bai-item.locked .idx{background:#F0F1F2; color:#C3C9CE;}
  main.content{min-width:0;}

  .panel{display:none; animation:rise .45s var(--ease);}
  .panel.active{display:block;}
  @keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .lesson-head{background:linear-gradient(120deg, var(--ink) 0%, #3c4653 100%); border-radius:var(--radius-lg); padding:24px 28px; color:#fff; margin-bottom:22px; position:relative; overflow:hidden;}
  .lesson-head::after{content:attr(data-bg); position:absolute; right:18px; top:50%; transform:translateY(-50%); font-family:'Noto Serif SC'; font-size:80px; font-weight:700; color:rgba(255,255,255,.06); white-space:nowrap;}
  .lesson-head .k{font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--teal); font-weight:700; margin-bottom:6px;}
  .lesson-head h2{margin:0; font-size:25px;}
  .lesson-head h2 .hanzi{font-weight:700;}
  .lesson-head p{margin:8px 0 0; color:rgba(255,255,255,.72); font-size:14.5px; max-width:600px; line-height:1.55; position:relative; z-index:1;}

  .sec{margin-bottom:34px;}
  .sec-head{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .sec-head .num{font-family:'Baloo 2'; font-weight:800; font-size:14px; color:#fff; background:var(--teal); min-width:30px; height:30px; padding:0 8px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sec-head h3{margin:0; font-size:18.5px;}
  .sec-head h3 .hanzi{font-size:17px; color:var(--ink-soft); font-weight:600; margin-left:6px;}
  .sec-head .sub{font-size:13px; color:var(--ink-soft); margin-left:auto;}

  /* ---------- Cards & instructions ---------- */
  .card{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:20px;}
  @media (max-width:560px){ .card{padding:18px 16px;} }
  .instr{font-size:16px; font-weight:700; margin-bottom:16px; padding-bottom:12px; border-bottom:1px dashed rgba(48,56,65,.14); display:flex; gap:10px; align-items:flex-start;}
  .instr .no{flex-shrink:0; background:var(--ink); color:#fff; font-family:'Baloo 2'; font-size:13px; width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .instr .vi{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); font-style:italic; margin-top:3px;}

  /* ---------- Ô điền ---------- */
  .fill-blank{display:inline-block; min-width:70px; max-width:100%; border:none; border-bottom:2px solid var(--teal); background:var(--teal-soft); border-radius:6px 6px 0 0; font-family:'Noto Serif SC', serif; font-size:1em; color:var(--flame); font-weight:600; text-align:center; padding:2px 8px; margin:0 2px; outline:none; vertical-align:baseline; transition:border-color .15s, background .15s;}
  .fill-blank.wide{min-width:220px;}
  @media (max-width:560px){ .fill-blank.wide{min-width:0; width:100%; display:block; margin:6px 0; text-align:left;} }
  .fill-blank::placeholder{color:#B9C0C6; font-weight:400; font-size:.8em;}
  .fill-blank:focus{border-bottom-color:var(--flame); background:#FFF0EA;}
  .fill-blank.correct{border-bottom-color:var(--ok); background:var(--ok-soft); color:var(--ok);}
  .fill-blank.wrong{border-bottom-color:var(--flame); background:var(--flame-soft);}
  .fill-blank.shown{border-bottom-color:var(--teal-dark); background:#EEF5F5; color:var(--teal-dark);}

  .ans-bar{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center;}
  .btn{border:none; padding:10px 18px; border-radius:100px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit; transition:transform .15s var(--ease), background .2s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--flame); color:#fff; box-shadow:0 8px 18px -8px rgba(255,87,34,.6);}
  .btn-ghost{background:var(--teal-soft); color:var(--teal-dark);}
  .btn-ghost:hover{background:#d6e8e8;}
  .btn-dark{background:var(--ink); color:#fff;}
  .score{font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .score.good{color:var(--ok);}

  .hint-box{display:none; margin-top:14px; background:#FFF8F4; border:1px dashed #FFC2A8; border-radius:12px; padding:14px 16px; font-size:15px; line-height:1.8;}
  .hint-box.open{display:block; animation:rise .3s var(--ease);}
  .hint-box .lbl{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--flame); margin-bottom:6px; font-family:'Be Vietnam Pro';}
  .hint-box ol{margin:0; padding-left:22px;}
  .hint-box .vi{display:block; font-size:13.5px; color:var(--ink-soft); font-style:italic; line-height:1.6;}

  .q-list{margin:0; padding-left:24px;}
  .q-list > li{font-size:16.5px; line-height:2; margin-bottom:10px;}
  .q-list > li:last-child{margin-bottom:0;}
  .q-list .key{color:var(--ink-soft); font-size:14px;}

  .word-bank{display:flex; flex-wrap:wrap; gap:8px; background:var(--paper); border-radius:12px; padding:12px 14px; margin-bottom:16px;}
  .word-bank span{background:#fff; border:1.5px solid #E2E6E9; border-radius:100px; padding:4px 14px; font-size:16.5px; font-weight:600; transition:.2s;}
  .word-bank span.used{opacity:.35; text-decoration:line-through;}

  /* ---------- Khởi động: hình người ---------- */
  .body-fig{position:relative; width:100%; max-width:760px; margin:0 auto; border-radius:14px; overflow:hidden; background:#fff;}
  .body-fig img{display:block; width:100%; height:auto;}
  .body-fig .slot{position:absolute; transform:translate(-50%,-50%); width:13%; min-width:52px;}
  .body-fig .slot input{width:100%; min-width:0; margin:0; padding:2px 4px; font-size:clamp(12px,2.1vw,17px); background:#fff; border:1.5px solid var(--teal); border-radius:8px; box-shadow:0 2px 6px -2px rgba(48,56,65,.25);}
  .body-fig .slot input.correct{background:var(--ok-soft); border-color:var(--ok);}
  .body-fig .slot input.wrong{background:var(--flame-soft); border-color:var(--flame);}
  .body-fig .slot input.shown{background:#EEF5F5; border-color:var(--teal-dark);}
  .body-fig .slot .given{display:block; text-align:center; font-family:'Noto Serif SC'; font-weight:700; color:var(--ink); background:#FFF3C9; border-radius:8px; padding:2px 4px; font-size:clamp(12px,2.1vw,17px);}
  .fig-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  @media (max-width:700px){ .fig-scroll.wide .body-fig{width:640px; max-width:none;} .fig-scroll.wide::after{content:'← vuốt ngang để xem cả hình →'; display:block; text-align:center; font-size:12px; color:var(--ink-soft); margin-top:6px;} }
  .body-fig .mark{position:absolute; transform:translate(-50%,-50%); min-width:26px; height:26px; padding:0 6px; border-radius:100px; background:var(--flame); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px -1px rgba(0,0,0,.35); font-family:'Be Vietnam Pro';}
  .fig-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px 14px; margin-top:16px;}
  .fig-list label{display:flex; align-items:center; gap:8px;}
  .fig-list .mk{flex-shrink:0; min-width:26px; height:26px; border-radius:100px; background:var(--flame); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .fig-list input, .fig-list select{flex:1; min-width:0; width:100%;}
  select.fill-blank{appearance:none; -webkit-appearance:none; cursor:pointer; padding-right:22px; background-image:linear-gradient(45deg,transparent 50%,var(--teal-dark) 50%),linear-gradient(135deg,var(--teal-dark) 50%,transparent 50%); background-position:calc(100% - 12px) 55%, calc(100% - 7px) 55%; background-size:5px 5px; background-repeat:no-repeat; text-align:left; font-size:16px;}
  .opts-bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .opts-bank span{background:var(--paper); border-radius:8px; padding:4px 12px; font-size:15.5px;}
  .opts-bank span b{color:var(--teal-dark); margin-right:4px; font-family:'Be Vietnam Pro'; font-size:13px;}
  .pn-list{display:flex; flex-wrap:wrap; gap:10px;}
  .pn{background:#fff; border-radius:12px; box-shadow:var(--shadow); padding:10px 16px; border-left:3px solid var(--teal);}
  .pn .h{font-family:'Noto Serif SC'; font-weight:700; font-size:19px;}
  .pn .p{color:var(--teal-dark); font-weight:600; margin-left:6px; font-size:14px;}
  .pn .v{display:block; font-size:13.5px; color:var(--ink-soft);}
  .match-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px;}
  .match-group{background:#FBF1E6; border-radius:14px; padding:14px 16px;}
  .match-group .gt{font-weight:700; color:var(--ink-soft); margin-bottom:8px; text-align:center;}
  .match-row{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:17px;}
  .match-row .l{min-width:72px; font-weight:600;}
  .match-row .ln{flex:0 0 26px; border-top:2px dashed #C9B8A3;}
  .match-row select{flex:1; min-width:0;}
  .match-row.example select{opacity:.75;}
  .fig-note{font-size:13px; color:var(--ink-soft); text-align:center; margin-top:10px; font-style:italic;}
  .verb-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0; font-size:16.5px;}
  .verb-row .lbl{font-weight:700; min-width:150px;}
  .verb-row .lbl .vi{display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); font-style:italic;}
  .verb-row .given{font-family:'Noto Serif SC'; font-weight:700; color:var(--flame); background:var(--flame-soft); padding:2px 12px; border-radius:6px;}

  /* ---------- Bài khóa ---------- */
  .audio-bar{display:flex; align-items:center; gap:14px; background:#fff; border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow); margin-bottom:18px;}
  .audio-bar .ic{width:38px; height:38px; border-radius:50%; background:var(--flame); color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .audio-bar audio{width:100%; height:36px;}
  .audio-bar .lbl{font-size:12.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  .audio-bar .lbl b{display:block; color:var(--ink); font-family:'JetBrains Mono'; font-size:12px;}
  @media (max-width:560px){ .audio-bar{flex-wrap:wrap;} }

  .toggles{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .tgl{display:inline-flex; align-items:center; gap:7px; background:#fff; border:1.5px solid #E2E6E9; color:var(--ink-soft); border-radius:100px; padding:8px 14px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit; transition:.2s;}
  .tgl .sw{width:28px; height:16px; border-radius:100px; background:#D5DADE; position:relative; transition:.2s;}
  .tgl .sw::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:.2s;}
  .tgl.on{border-color:var(--teal); color:var(--teal-dark);}
  .tgl.on .sw{background:var(--teal);}
  .tgl.on .sw::after{left:14px;}
  .toggles .meta{margin-left:auto; font-size:13px; color:var(--ink-soft);}

  .reading{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:30px 34px; position:relative;}
  .reading::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--flame); border-radius:var(--radius-lg) 0 0 var(--radius-lg);}
  @media (max-width:560px){ .reading{padding:22px 18px;} }
  .reading h3.rt{text-align:center; font-family:'Noto Serif SC'; font-size:24px; margin:0 0 4px;}
  .reading .rt-vi{text-align:center; font-size:14px; color:var(--ink-soft); font-style:italic; margin-bottom:20px;}
  .reading .photo{float:right; width:46%; max-width:320px; margin:4px 0 14px 22px; border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
  .reading .photo img{display:block; width:100%;}
  @media (max-width:640px){ .reading .photo{float:none; width:100%; max-width:none; margin:0 0 18px;} }
  .para{margin-bottom:22px;}
  .para:last-of-type{margin-bottom:0;}
  .para .hz{font-size:19px; line-height:2.05; text-indent:2em; font-family:'Noto Serif SC'; font-weight:500;}
  .para .py{display:none; font-size:13.5px; color:var(--teal-dark); line-height:1.7; margin-top:4px;}
  .para .vi{display:none; font-size:15px; color:var(--ink-soft); font-style:italic; line-height:1.7; margin-top:6px; padding-left:12px; border-left:3px solid var(--teal-soft);}
  .reading.show-py .para .py{display:block;}
  .reading.show-vi .para .vi{display:block;}
  .reading .source{clear:both; text-align:right; font-size:13px; color:var(--ink-soft); margin-top:18px; font-family:'Noto Serif SC';}
  .nw{color:var(--flame); border-bottom:1.5px dotted var(--flame); cursor:pointer; text-indent:0;}
  .reading.no-hl .nw{color:inherit; border-bottom-color:transparent;}
  .nw:hover{background:var(--flame-soft);}

  .pop{position:fixed; z-index:70; background:var(--ink); color:#fff; border-radius:12px; padding:10px 14px; box-shadow:0 14px 30px -10px rgba(0,0,0,.45); max-width:260px; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .15s, transform .15s;}
  .pop.open{opacity:1; transform:translateY(0);}
  .pop .p-hz{font-family:'Noto Serif SC'; font-size:20px; font-weight:700;}
  .pop .p-py{color:var(--teal); font-weight:600; margin-left:6px;}
  .pop .p-pos{display:inline-block; background:var(--flame); font-size:11px; font-weight:700; padding:1px 8px; border-radius:100px; margin-top:4px;}
  .pop .p-vi{font-size:14px; margin-top:4px; line-height:1.5;}

  /* ---------- Từ vựng ---------- */
  .vocab-tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .vocab-tools input[type=search]{flex:1 1 220px; border:1.5px solid #E2E6E9; border-radius:100px; padding:10px 16px; font-size:14.5px; font-family:inherit; outline:none; background:#fff;}
  .vocab-tools input[type=search]:focus{border-color:var(--teal);}
  .vocab-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
  @media (max-width:980px){ .vocab-grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:520px){ .vocab-grid{grid-template-columns:1fr;} }
  .flip{perspective:1400px; height:330px; cursor:pointer;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .6s var(--ease); transform-style:preserve-3d;}
  .flip.open .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:var(--radius-md); box-shadow:var(--shadow); background:#fff; padding:16px; display:flex; flex-direction:column;}
  .flip-front{align-items:center; justify-content:center; text-align:center; gap:8px;}
  .flip-front .no{position:absolute; top:12px; left:14px; font-family:'Baloo 2'; font-weight:700; color:#C3C9CE; font-size:15px;}
  .flip-front .hz{font-size:60px; font-weight:700; color:var(--ink); line-height:1.15;}
  .flip-front .hz.long{font-size:40px;}
  .flip-front .py{color:var(--teal); font-weight:600; font-size:17px;}
  .flip-front .hint{position:absolute; bottom:12px; font-size:11px; color:#B9C0C6; letter-spacing:.04em;}
  .flip-back{transform:rotateY(180deg); background:var(--ink); color:#fff; padding:20px;}
  .flip-back .row1{display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .flip-back .hz-sm{font-size:30px; font-weight:700;}
  .flip-back .py-sm{color:var(--teal); font-size:16px; font-weight:600;}
  .pos-badge{align-self:flex-start; font-size:12.5px; font-weight:700; background:var(--flame); color:#fff; padding:4px 11px; border-radius:100px; margin-bottom:10px;}
  .flip-back .meaning{font-size:17.5px; font-weight:600; margin-bottom:10px;}
  .flip-back .example{font-size:14px; line-height:1.6; color:rgba(255,255,255,.75); border-top:1px solid rgba(255,255,255,.14); padding-top:10px; flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.35) transparent;}
  .flip-back .example .ex-hz{color:#fff; font-weight:500; font-size:16px;}
  .flip-back .example .ex-tag{display:inline-block; font-size:10.5px; font-weight:700; background:rgba(118,171,174,.3); color:#BFE0E1; padding:1px 7px; border-radius:100px; margin-bottom:4px;}
  .vocab-actions{display:flex; gap:8px; margin-top:12px;}
  .stroke-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:13.5px; font-weight:600; padding:10px; border-radius:9px; cursor:pointer; font-family:inherit; transition:background .2s;}
  .stroke-btn:hover{background:var(--flame); border-color:var(--flame);}
  .audio-btn{flex:0 0 auto; width:42px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:15px; border-radius:9px; cursor:pointer; transition:background .2s, transform .15s;}
  .audio-btn:hover, .audio-btn.playing{background:var(--teal); border-color:var(--teal);}
  .empty{text-align:center; padding:30px; color:var(--ink-soft); grid-column:1/-1;}

  /* stroke modal */
  .stroke-overlay{position:fixed; inset:0; background:rgba(48,56,65,.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
  .stroke-overlay.open{display:flex;}
  .stroke-card{position:relative; background:#fff; border-radius:var(--radius-lg); padding:26px; width:min(460px,92vw); box-shadow:0 30px 60px -20px rgba(0,0,0,.4); text-align:center; animation:pop .35s var(--ease);}
  @keyframes pop{from{opacity:0; transform:scale(.9) translateY(10px);} to{opacity:1; transform:none;}}
  .stroke-card h4{margin:0 0 4px; font-size:22px;}
  .stroke-card .py-big{color:var(--teal); font-weight:600; margin-bottom:14px;}
  .writer-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .writer-box{width:96px; height:96px; background:var(--paper); border-radius:12px; border:1.5px solid #ECECEC;}
  .stroke-actions{display:flex; gap:10px; justify-content:center;}
  .stroke-close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:#B9C0C6; cursor:pointer;}

  /* ---------- Chú thích ---------- */
  .part-title{display:flex; align-items:baseline; gap:10px; margin:30px 0 14px; font-family:'Baloo 2'; font-size:19px; font-weight:700;}
  .part-title:first-child{margin-top:0;}
  .part-title .hanzi{font-size:18px;}
  .part-title .vi{font-family:'Be Vietnam Pro'; font-size:13.5px; color:var(--ink-soft); font-weight:500;}
  .gram-card{border-left:4px solid var(--teal);}
  .g-title{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .g-title .gno{background:var(--teal); color:#fff; font-family:'Baloo 2'; font-weight:800; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .g-title .hanzi{font-size:24px; font-weight:700;}
  .g-title .py{color:var(--teal-dark); font-weight:600;}
  .g-block{margin-bottom:16px;}
  .g-expl{font-size:16px; line-height:1.75; margin-bottom:8px;}
  .g-expl .vi{display:block; font-size:14.5px; color:var(--ink-soft); line-height:1.65;}
  .g-examples{display:flex; flex-direction:column; gap:8px;}
  .g-ex{background:var(--paper); border-radius:9px; padding:10px 14px; font-size:16.5px; line-height:1.65;}
  .g-ex .n{color:var(--teal-dark); font-weight:700; margin-right:4px; font-family:'Be Vietnam Pro'; font-size:14px;}
  .g-ex.from-text{background:#FFF4EC; border-left:3px solid var(--flame);}
  .g-ex.from-text .hanzi{color:#B5471E;}
  .g-ex .tag{display:inline-block; font-size:10.5px; font-weight:700; color:var(--flame); background:var(--flame-soft); padding:1px 8px; border-radius:100px; margin-left:6px; vertical-align:middle; font-family:'Be Vietnam Pro';}
  .g-ex .vi{display:block; font-size:13.5px; color:var(--ink-soft); font-style:italic; margin-top:2px;}
  .g-exercise{border-top:1px dashed rgba(48,56,65,.14); padding-top:14px; margin-top:6px;}
  .g-exercise .ex-title{font-weight:700; font-size:14.5px; color:var(--flame); margin-bottom:10px;}
  .g-exercise .ex-title .vi{color:var(--ink-soft); font-weight:500; font-style:italic; font-size:13px; margin-left:6px;}
  .g-exercise ol{margin:0; padding-left:22px;}
  .g-exercise li{font-size:16.5px; line-height:2; margin-bottom:8px;}
  .g-exercise li .use{color:var(--teal-dark); font-weight:600; font-size:14px; margin-left:4px;}

  .tbl-wrap{overflow-x:auto; margin-bottom:6px;}

  table.collo th{background:#F3E7C2; font-weight:700; padding:9px 12px; text-align:center;}
  table.collo th .vi{display:block; font-size:11.5px; font-weight:500; color:var(--ink-soft); font-family:'Be Vietnam Pro';}
  table.collo td{padding:9px 12px; border-bottom:1px dashed #E2E6E9; text-align:center; line-height:1.6;}
  table.collo td .vi{display:block; font-size:12.5px; color:var(--ink-soft); font-style:italic; font-family:'Be Vietnam Pro';}
  table.collo td:first-child{width:42%;}

  .cmp{width:100%; border-collapse:separate; border-spacing:0; font-size:15.5px; min-width:560px;}
  .cmp th{padding:10px; font-size:18px; background:var(--teal-soft); color:var(--teal-dark);}
  .cmp th:first-child{background:none; width:56px;}
  .cmp td{padding:10px 12px; vertical-align:top; border-bottom:1px solid #EEF0F2; line-height:1.65;}
  .cmp td.side{writing-mode:vertical-rl; text-align:center; font-weight:700; background:var(--paper); color:var(--ink-soft); letter-spacing:.2em; font-size:14px;}
  .cmp td .eg{display:block; margin-top:4px; color:var(--ink);}
  .cmp td .vi{display:block; font-size:12.5px; color:var(--ink-soft); font-style:italic; font-family:'Be Vietnam Pro';}
  .cmp td.common{background:#FBFCFC;}

  .choose-tbl{width:100%; border-collapse:collapse; font-size:16px; min-width:520px; margin-top:6px;}
  .choose-tbl th{font-size:14px; padding:8px; color:var(--ink-soft); width:76px;}
  .choose-tbl td{padding:10px 8px; border-top:1px solid #EEF0F2; line-height:1.7;}
  .choose-tbl tr:nth-child(even) td{background:#FAFBFB;}
  .choose-tbl td.c{text-align:center;}
  .chk{width:30px; height:30px; border-radius:8px; border:2px solid #CDD3D8; background:#fff; cursor:pointer; font-size:16px; font-weight:700; color:#fff; transition:.15s;}
  .chk.on{background:var(--teal); border-color:var(--teal);}
  .chk.ok{background:var(--ok); border-color:var(--ok);}
  .chk.bad{background:var(--flame); border-color:var(--flame);}
  .chk.miss{border-color:var(--ok); border-style:dashed;}
  .chk.locked{cursor:default;}
  .blank-line{display:inline-block; min-width:44px; border-bottom:2px solid var(--ink-soft); text-align:center; color:var(--flame); font-weight:700;}

  /* ---------- Bài tập: chọn A/B ---------- */
  .opt-row{display:inline-flex; gap:8px; margin-left:6px; flex-wrap:wrap; vertical-align:middle;}
  .opt{border:1.5px solid #E2E6E9; background:var(--paper); border-radius:10px; padding:4px 12px; font-size:16px; cursor:pointer; font-family:'Noto Serif SC'; transition:.15s;}
  .opt b{font-family:'Be Vietnam Pro'; color:var(--teal-dark); margin-right:4px;}
  .opt:hover{background:var(--teal-soft);}
  .opt.correct{border-color:var(--ok); background:var(--ok-soft);}
  .opt.wrong{border-color:var(--flame); background:var(--flame-soft);}
  .opt.reveal{border-color:var(--ok); border-style:dashed;}
  .opt-blank{display:inline-block; min-width:56px; border-bottom:2px solid var(--teal); text-align:center; color:var(--flame); font-weight:700;}

  /* chọn vị trí */
  .pos-sent{font-size:17px; line-height:2.2;}
  .pos-btn{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--teal); background:#fff; color:var(--teal-dark); font-weight:700; font-family:'Be Vietnam Pro'; font-size:13px; cursor:pointer; margin:0 3px; vertical-align:middle; transition:.15s;}
  .pos-btn:hover{background:var(--teal-soft);}
  .pos-btn.correct{background:var(--ok); border-color:var(--ok); color:#fff;}
  .pos-btn.wrong{background:var(--flame); border-color:var(--flame); color:#fff;}
  .pos-btn.reveal{border-color:var(--ok); border-style:dashed; color:var(--ok);}
  .pos-word{display:inline-block; margin-left:8px; background:var(--flame-soft); color:var(--flame); font-weight:700; padding:0 10px; border-radius:6px; font-family:'Noto Serif SC';}
  .pos-fix{display:none; font-size:15px; color:var(--ok); margin-top:2px;}
  .pos-fix.open{display:block;}

  /* thuật lại */
  .retell{width:100%; border-collapse:separate; border-spacing:0 10px;}
  .retell td{vertical-align:top;}
  .retell .who{width:128px; background:#E8F0E0; border-radius:12px 0 0 12px; padding:14px; font-weight:700; text-align:center;}
  .retell .who .vi{display:block; font-size:12px; color:var(--ink-soft); font-weight:500;}
  .retell .kw{width:30%; background:#FBEBD9; padding:14px; font-size:16.5px; line-height:1.9;}
  .retell .kw .chip{display:inline-block; background:#fff; border-radius:6px; padding:0 8px; margin:2px 3px 2px 0; font-size:15.5px;}
  .retell .ta{background:#EEF0F6; border-radius:0 12px 12px 0; padding:10px;}
  @media (max-width:700px){
    .retell, .retell tbody, .retell tr, .retell td{display:block; width:100%;}
    .retell .who{border-radius:12px 12px 0 0; width:100%;}
    .retell .kw{width:100%;}
    .retell .ta{border-radius:0 0 12px 12px; margin-bottom:10px;}
  }
  textarea.write{width:100%; min-height:110px; border:1.5px solid #D9DEE2; border-radius:10px; padding:10px 12px; font-family:'Noto Serif SC'; font-size:16px; line-height:1.8; resize:vertical; outline:none; background:#fff;}
  textarea.write:focus{border-color:var(--teal);}
  textarea.write.big{min-height:200px;}
  .counter{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ink-soft); margin-top:6px; gap:10px; flex-wrap:wrap;}
  .counter .cnt{font-weight:700;}
  .counter .cnt.ok{color:var(--ok);}
  .cbar{flex:1 1 140px; max-width:240px; height:6px; background:#E2E6E9; border-radius:100px; overflow:hidden;}
  .cbar i{display:block; height:100%; width:0; background:var(--teal); border-radius:100px; transition:width .2s;}
  .cbar i.full{background:var(--ok);}

  /* ---------- Mở rộng & vận dụng ---------- */
  .topic-tbl{width:100%; border-collapse:collapse; border:1.5px solid var(--ink); border-radius:10px; overflow:hidden;}
  .topic-tbl th{background:#3F4A68; color:#fff; padding:9px 12px; font-size:15px;}
  .topic-tbl td{padding:12px 14px; border-top:1.5px solid var(--ink);}
  .topic-tbl td.t{width:112px; white-space:nowrap; text-align:center; font-weight:700; font-size:18px; border-right:1.5px solid var(--ink);}
  .topic-tbl td.t .vi{display:block; font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .tw-list{display:flex; flex-wrap:wrap; gap:8px;}
  .tw{background:var(--paper); border-radius:10px; padding:6px 12px; cursor:pointer; transition:.15s; border:1.5px solid transparent;}
  .tw:hover{border-color:var(--teal);}
  .tw .h{font-family:'Noto Serif SC'; font-weight:700; font-size:17px;}
  .tw .p{font-size:12.5px; color:var(--teal-dark); margin-left:4px;}
  .tw .v{display:block; font-size:12.5px; color:var(--ink-soft);}

  .bg-wrap{display:flex; gap:22px; align-items:flex-start;}
  .bg-wrap .txt{flex:1; min-width:0;}
  .bg-wrap .pic{width:230px; flex-shrink:0; border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
  .bg-wrap .pic img{display:block; width:100%;}
  @media (max-width:700px){ .bg-wrap{flex-direction:column;} .bg-wrap .pic{width:100%; max-width:300px; margin:0 auto;} }
  .bg-text .hz{font-size:17px; line-height:2; text-indent:2em; font-family:'Noto Serif SC';}
  .bg-text .vi{font-size:14.5px; line-height:1.7; color:var(--ink-soft); font-style:italic; margin-top:8px; display:none;}
  .bg-text.show-vi .vi{display:block;}
  .disc-title{font-size:18px; font-weight:700; margin:20px 0 10px;}
  .disc-title .vi{display:block; font-size:13.5px; color:var(--ink-soft); font-weight:500; font-style:italic;}
  .disc-list{margin:0; padding-left:24px;}
  .disc-list li{font-size:16.5px; line-height:1.8; margin-bottom:10px;}
  .disc-list li .vi{display:block; font-size:14px; color:var(--ink-soft); font-style:italic;}

  .lesson-nav{display:flex; justify-content:space-between; gap:12px; margin-top:34px;}
  .lesson-nav a{display:inline-flex; align-items:center; gap:8px; background:#fff; box-shadow:var(--shadow); border-radius:100px; padding:11px 18px; font-weight:600; font-size:14px; color:var(--ink); text-decoration:none; transition:.2s;}
  .lesson-nav a:hover{color:var(--flame);}
  .lesson-nav .disabled{opacity:.4; pointer-events:none;}
</style>

<script>
/* =====================================================================
   KHI LÀM BÀI MỚI: chỉ cần sửa CURRENT_BAI và object LESSON bên dưới.
   Quy ước trong chuỗi:
     {{đáp án}}       → ô điền có đáp án (nhiều đáp án đúng: {{A|B}})
     {{?}}            → ô điền tự do (không chấm), đáp án gợi ý để ở "hint"
     {{?:gợi ý}}      → ô điền tự do, chữ mờ gợi ý bên trong ô
   File media:
     audio/baiN/<mã>.mp3      audio bài khóa / từ vựng theo mã đĩa (vd 01-1)
     audio/baiN/<từ>.mp3      phát âm từng từ
     strokes/baiN/<chữ>.gif   nét viết từng chữ
     images/baiN/...          ảnh minh họa
   ===================================================================== */
const CURRENT_BAI = 4;

const LESSON = {
  title:"子路背米",
  titleVi:"Tử Lộ vác gạo",
  bgChar:"孝",

  /* ---------------- 热身 · KHỞI ĐỘNG ---------------- */
  warmup:[
    {type:"blanks",

    paras:[
      {hz:"从前，大概在距今两千五百多年前的春秋时期，有一个人叫子路，他是孔子最年长的学生。流传至今的“百里背米”讲的就是他孝敬父母的故事。",
       py:"Cóngqián, dàgài zài jù jīn liǎngqiān wǔbǎi duō nián qián de Chūnqiū shíqī, yǒu yí ge rén jiào Zǐlù, tā shì Kǒngzǐ zuì niánzhǎng de xuésheng. Liúchuán zhìjīn de “bǎi lǐ bēi mǐ” jiǎng de jiù shì tā xiàojìng fùmǔ de gùshi.",
       vi:"Ngày xưa, vào thời Xuân Thu cách đây khoảng hơn hai nghìn năm trăm năm, có một người tên là Tử Lộ, ông là học trò lớn tuổi nhất của Khổng Tử. Câu chuyện “vác gạo trăm dặm” lưu truyền đến nay chính là kể về lòng hiếu kính cha mẹ của ông."},
      {hz:"子路的父母都是农民。由于连年的战争，家里生活非常困难。一天，子路从外面回来，听到父母在屋里说话：“活了大半辈子了，别说鱼肉，只要能饱饱地吃上一顿米饭，也就满足啦！”子路听了，心里觉得十分惭愧。他暗下决心：“一定要让父母吃上米饭，不能再委屈他们了！”",
       py:"Zǐlù de fùmǔ dōu shì nóngmín. Yóuyú liánnián de zhànzhēng, jiāli shēnghuó fēicháng kùnnan. Yì tiān, Zǐlù cóng wàimiàn huílái, tīngdào fùmǔ zài wū li shuōhuà: “Huóle dà bànbèizi le, bié shuō yú ròu, zhǐyào néng bǎobǎo de chīshàng yí dùn mǐfàn, yě jiù mǎnzú la!” Zǐlù tīngle, xīnli juéde shífēn cánkuì. Tā àn xià juéxīn: “Yídìng yào ràng fùmǔ chīshàng mǐfàn, bù néng zài wěiqu tāmen le!”",
       vi:"Cha mẹ Tử Lộ đều là nông dân. Vì chiến tranh liên miên năm này qua năm khác, cuộc sống trong nhà vô cùng khó khăn. Một hôm, Tử Lộ từ bên ngoài trở về, nghe thấy cha mẹ nói chuyện trong nhà: “Sống đã quá nửa đời người rồi, đừng nói là cá thịt, chỉ cần được ăn no một bữa cơm gạo thôi cũng mãn nguyện lắm rồi!” Tử Lộ nghe xong, trong lòng vô cùng hổ thẹn. Ông thầm hạ quyết tâm: “Nhất định phải để cha mẹ được ăn cơm gạo, không thể để họ chịu thiệt thòi nữa!”"},
      {hz:"子路打听到百里之外有个有钱人，家里缺干活儿的人，决定去试一试。那家主人见他身体结实，就留下了他。子路干起活来十分勤奋，主人很喜欢这个小伙子。半年后，当子路要回家时，发现主人给的银子比他应该得到的多了许多，子路老老实实地告诉了主人。主人笑着说：“孩子，工钱没算错，你做事勤快，这是我给你加的奖金。”",
       py:"Zǐlù dǎtīng dào bǎi lǐ zhī wài yǒu ge yǒuqián rén, jiāli quē gàn huór de rén, juédìng qù shì yi shì. Nà jiā zhǔrén jiàn tā shēntǐ jiēshi, jiù liúxiàle tā. Zǐlù gàn qǐ huó lái shífēn qínfèn, zhǔrén hěn xǐhuan zhège xiǎohuǒzi. Bàn nián hòu, dāng Zǐlù yào huí jiā shí, fāxiàn zhǔrén gěi de yínzi bǐ tā yīnggāi dédào de duōle xǔduō, Zǐlù lǎolǎoshíshí de gàosule zhǔrén. Zhǔrén xiàozhe shuō: “Háizi, gōngqián méi suàncuò, nǐ zuòshì qínkuai, zhè shì wǒ gěi nǐ jiā de jiǎngjīn.”",
       vi:"Tử Lộ dò hỏi được rằng cách đó trăm dặm có một nhà giàu đang thiếu người làm, bèn quyết định đi thử. Chủ nhà ấy thấy ông khỏe mạnh lực lưỡng nên giữ ông lại. Tử Lộ làm việc vô cùng chăm chỉ, chủ nhà rất quý chàng trai này. Nửa năm sau, khi Tử Lộ chuẩn bị về nhà, ông phát hiện số bạc chủ nhà trả nhiều hơn khá nhiều so với phần mình đáng được nhận, bèn thật thà nói với chủ nhà. Chủ nhà cười bảo: “Con à, tiền công không tính nhầm đâu, con làm việc siêng năng, đây là tiền thưởng ta thêm cho con.”"},
      {hz:"谢过主人，子路高兴地上路了。路过镇上，他买了一袋米、一块肉、两条鱼，背在后背上。天气非常寒冷，雪地很滑，子路不小心滑了一下，背上的米袋差点儿被甩出去。他顶着大雪往前走，扶着米袋的双手冻得不行，就停下来暖暖，再继续赶路。终于到家了，见到父母，子路把给他们买的东西及剩下的工钱都交给了他们。一家人高高兴兴地生火做饭，饱饱地吃了顿团圆饭。",
       py:"Xièguo zhǔrén, Zǐlù gāoxìng de shàng lù le. Lùguò zhèn shang, tā mǎile yí dài mǐ, yí kuài ròu, liǎng tiáo yú, bēi zài hòubèi shang. Tiānqì fēicháng hánlěng, xuědì hěn huá, Zǐlù bù xiǎoxīn huále yí xià, bèi shang de mǐdài chàdiǎnr bèi shuǎi chūqù. Tā dǐngzhe dàxuě wǎng qián zǒu, fúzhe mǐdài de shuāngshǒu dòng de bùxíng, jiù tíng xiàlái nuǎnnuan, zài jìxù gǎnlù. Zhōngyú dào jiā le, jiàndào fùmǔ, Zǐlù bǎ gěi tāmen mǎi de dōngxi jí shèngxià de gōngqián dōu jiāogěile tāmen. Yì jiā rén gāogāoxìngxìng de shēng huǒ zuò fàn, bǎobǎo de chīle dùn tuányuán fàn.",
       vi:"Cảm ơn chủ nhà xong, Tử Lộ vui vẻ lên đường. Đi ngang qua thị trấn, ông mua một bao gạo, một miếng thịt, hai con cá, vác trên lưng. Trời vô cùng giá rét, đường tuyết rất trơn, Tử Lộ sơ ý trượt chân, bao gạo trên lưng suýt nữa bị văng ra ngoài. Ông đội tuyết lớn đi về phía trước, hai bàn tay đỡ bao gạo lạnh cóng đến tê dại, ông bèn dừng lại sưởi ấm một chút rồi lại tiếp tục lên đường. Cuối cùng cũng về tới nhà, gặp cha mẹ, Tử Lộ đưa hết đồ mua cho cha mẹ cùng số tiền công còn lại. Cả nhà vui vẻ nhóm lửa nấu cơm, cùng ăn no một bữa cơm đoàn viên."},
      {hz:"后来子路的父母去世了，他也南下到了楚国。楚国国君觉得他很有本领，是个人才，就留他做了官，并给他很优厚的待遇。但他并没有因为物质条件好而感到欢喜，反而常常诚恳地说：“多么希望父母能和我一起过好日子！我现在有了一点儿成就，可他们已经不在了，即使再想背米百里去孝敬双亲，也不可能了。”",
       py:"Hòulái Zǐlù de fùmǔ qùshì le, tā yě nánxià dàole Chǔguó. Chǔguó guójūn juéde tā hěn yǒu běnlǐng, shì ge réncái, jiù liú tā zuòle guān, bìng gěi tā hěn yōuhòu de dàiyù. Dàn tā bìng méiyǒu yīnwèi wùzhì tiáojiàn hǎo ér gǎndào huānxǐ, fǎn'ér chángcháng chéngkěn de shuō: “Duōme xīwàng fùmǔ néng hé wǒ yìqǐ guò hǎo rìzi! Wǒ xiànzài yǒule yìdiǎnr chéngjiù, kě tāmen yǐjīng bú zài le, jíshǐ zài xiǎng bēi mǐ bǎi lǐ qù xiàojìng shuāngqīn, yě bù kěnéng le.”",
       vi:"Về sau cha mẹ Tử Lộ qua đời, ông cũng xuống phía nam đến nước Sở. Vua nước Sở thấy ông rất có bản lĩnh, là người tài, bèn giữ ông lại làm quan và đãi ngộ ông rất hậu. Nhưng ông không hề vì điều kiện vật chất tốt mà vui mừng, trái lại thường chân thành nói: “Ước gì cha mẹ được cùng tôi sống những ngày tốt đẹp! Bây giờ tôi đã có chút thành tựu, nhưng cha mẹ không còn nữa, dù muốn vác gạo trăm dặm để hiếu kính song thân cũng không thể được nữa rồi.”"},
      {hz:"中国古代有句话叫“百善孝为先”，意思是说，孝顺父母是各种美德中占第一位的。子路为了让父母吃到较好的食物，不怕辛苦，这种做法确实值得我们学习。",
       py:"Zhōngguó gǔdài yǒu jù huà jiào “bǎi shàn xiào wéi xiān”, yìsi shì shuō, xiàoshùn fùmǔ shì gè zhǒng měidé zhōng zhàn dì-yī wèi de. Zǐlù wèile ràng fùmǔ chīdào jiào hǎo de shíwù, bú pà xīnkǔ, zhè zhǒng zuòfǎ quèshí zhíde wǒmen xuéxí.",
       vi:"Thời cổ đại Trung Quốc có câu “Bách thiện hiếu vi tiên” (trong trăm điều thiện, chữ hiếu đứng đầu), ý nói hiếu thảo với cha mẹ là đức tính đứng hàng đầu trong mọi phẩm chất tốt đẹp. Tử Lộ vì muốn cha mẹ được ăn ngon hơn mà không ngại vất vả, cách làm ấy thật đáng để chúng ta học tập."}

  notes:[
    {
      word:"至今", py:"zhìjīn",
      blocks:[
        {zh:"“至今”，副词，直到现在，常用于小句句首或动词前。也可与一些词语搭配形成固定结构，如“从古至今”“流传至今”等。例如：", vi:"“至今” là phó từ, nghĩa là cho đến nay, thường đứng đầu phân câu hoặc trước động từ. Cũng có thể kết hợp với một số từ tạo thành cấu trúc cố định như “从古至今” (từ xưa đến nay), “流传至今” (lưu truyền đến nay). Ví dụ:",
         ex:[
           {zh:"我在北京出生、长大，至今还没离开过呢。", vi:"Tôi sinh ra và lớn lên ở Bắc Kinh, đến giờ vẫn chưa từng rời khỏi đó."},
           {zh:"至今，很多国家并没有规定什么才是健康食品。", vi:"Cho đến nay, nhiều nước vẫn chưa quy định thế nào mới là thực phẩm lành mạnh."},
           {zh:"流传至今的“百里背米”讲的就是他孝敬父母的故事。", vi:"Chuyện “vác gạo trăm dặm” lưu truyền đến nay kể về lòng hiếu kính cha mẹ của ông.", fromText:true}
         ]}
      ],
      practice:[
        "虽然我们已经认识多年，{{?}}。<span class='use'>（至今）</span>",
        "A：你到中国已经一年了，能不能给我们介绍一下长城？<br>B：{{?}}。<span class='use'>（至今）</span>",
        "到底什么是幸福，{{?}}。<span class='use'>（至今）</span>"
      ],
      hint:[
        "虽然我们已经认识多年，<b>可我至今还不知道他的生日是哪天</b>。",
        "B：<b>不好意思，我至今还没去过长城呢</b>。",
        "到底什么是幸福，<b>我至今也没想明白</b>。"
      ]
    },
    {
      word:"顶", py:"dǐng",
      blocks:[
        {zh:"“顶”，名词，表示人体或物体的最高部分。例如：", vi:"“顶” là danh từ, chỉ phần cao nhất của cơ thể người hoặc vật thể (đỉnh, chóp). Ví dụ:",
         ex:[
           {zh:"请把手举过头顶。", vi:"Hãy giơ tay lên quá đỉnh đầu."},
           {zh:"父亲的朋友画了张画儿送我，画上是一座山，山顶有一个人往下看，山下有一个人往上看。", vi:"Bạn của bố vẽ tặng tôi một bức tranh: một ngọn núi, trên đỉnh núi có một người nhìn xuống, dưới chân núi có một người nhìn lên."}
         ]},
        {zh:"“顶”，还可以做动词，表示头部的动作。例如：", vi:"“顶” còn có thể làm động từ, chỉ động tác của đầu (đội, húc). Ví dụ:",
         ex:[
           {zh:"他能用头顶起20斤重的东西。", vi:"Anh ấy có thể đội trên đầu đồ vật nặng 20 cân."},
           {zh:"院子里有两只羊正在打架，它们头顶着头，角对着角，就像两个小孩儿一样，谁也不愿让谁。", vi:"Trong sân có hai con dê đang húc nhau, đầu chạm đầu, sừng chạm sừng, giống như hai đứa trẻ, không ai chịu nhường ai."}
         ]},
        {zh:"“顶”做动词时还表示迎着、抵挡。例如：", vi:"Khi làm động từ, “顶” còn có nghĩa là đi ngược, chống chọi (đội, bất chấp). Ví dụ:",
         ex:[
           {zh:"天气非常寒冷，子路顶着大雪往前走。", vi:"Trời vô cùng giá rét, Tử Lộ đội tuyết lớn đi về phía trước.", fromText:true},
           {zh:"您为什么要顶着压力来做这件事呢？", vi:"Vì sao ông lại chịu áp lực để làm việc này?"}
         ]},
        {zh:"“顶”，还可以做量词，用于帽子、较大的伞或伞状的东西。例如：", vi:"“顶” còn có thể làm lượng từ, dùng cho mũ, ô lớn hoặc vật có hình chiếc ô (chiếc, cái). Ví dụ:",
         ex:[
           {zh:"我这顶新帽子怎么样？", vi:"Chiếc mũ mới này của tôi thế nào?"},
           {zh:"这项计划将成为儿童健康的一顶保护伞。", vi:"Kế hoạch này sẽ trở thành chiếc ô bảo vệ sức khỏe trẻ em."}
         ]}
      ],
      practice:[

        "虽然昨天刮大风，<b>他还是顶着大风去上班了</b>。",
        "A：<b>我觉得这顶帽子很适合你</b>。"
      ]
    },
    {

        {zh:"“……得＋不行”，表示程度，还可以用“……得＋很/不得了”等。例如：", vi:"“……得＋不行” biểu thị mức độ (… đến mức không chịu nổi, … kinh khủng), cũng có thể dùng “……得＋很/不得了”. Ví dụ:",

           {zh:"他心里烦得很，自言自语地抱怨：“怎么还有那么远啊！”", vi:"Trong lòng anh ta bực bội lắm, lẩm bẩm phàn nàn: “Sao vẫn còn xa thế!”"}
         ]}
      ],
      practice:[
        "A：你们俩这次出去旅行了大半年，家里一直没人收拾。昨天回来，家里怎么样？<br>B：{{?}}。<span class='use'>（……得不行）</span>",

        "B：<b>是啊，他难过得不得了，好几天都没吃饭</b>。"

      "子路从外面回来：一天，子路听到父母说，只要能饱饱地吃上一顿米饭就满足了。他心里十分惭愧，暗下决心一定要让父母吃上米饭。",

    bg:{zh:"“孝”是中国儒家（Rújiā）文化中一个重要的内容。孔子在《论语》中就提到“孝悌（xiàotì）”，认为人应该孝顺父母、爱兄弟。子路是个很孝顺的人，为了让父母过上更好的生活，他不怕辛苦，不怕寒冷。你愿意像他一样孝顺父母吗？",
        vi:"“Hiếu” là một nội dung quan trọng trong văn hóa Nho gia Trung Quốc. Khổng Tử trong sách “Luận ngữ” đã nhắc đến “hiếu đễ”, cho rằng con người phải hiếu thảo với cha mẹ, yêu thương anh em. Tử Lộ là người rất hiếu thảo; để cha mẹ có cuộc sống tốt hơn, ông không ngại vất vả, không sợ giá rét. Bạn có muốn hiếu thảo với cha mẹ giống như ông không?"},
    topic:{zh:"什么是孝顺？", vi:"Hiếu thảo là gì?"},
    questions:[
      {zh:"中国人说的“孝”是什么意思？", vi:"Chữ “hiếu” mà người Trung Quốc nói có nghĩa là gì?"},
      {zh:"你认为应该如何去关爱你的父母？", vi:"Bạn cho rằng nên quan tâm, yêu thương cha mẹ mình như thế nào?"},
      {zh:"如果有一天，你的父母身体不好了，需要有人照顾时，你会怎么做？", vi:"Nếu một ngày nào đó cha mẹ bạn sức khỏe yếu, cần người chăm sóc, bạn sẽ làm gì?"}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---- Ô điền: {{đáp án}} / {{?}} / {{?:gợi ý}} ---- */
function fill(str){
  return str.replace(/\{\{(.*?)\}\}/g, (m, inner)=>{
    if(inner === '?' ) return `<input class="fill-blank wide" placeholder="…" autocomplete="off" spellcheck="false">`;
    if(inner.startsWith('?:')) return `<input class="fill-blank wide" placeholder="${inner.slice(2)}" autocomplete="off" spellcheck="false">`;
    const w = Math.max(...inner.split('|').map(a=>a.length));
    return `<input class="fill-blank" data-ans="${inner}" style="width:${Math.max(70, w*22+30)}px" placeholder="…" autocomplete="off" spellcheck="false">`;
  });
}
const norm = s => s.replace(/[\s。，、．.,!！?？（）()]/g,'');

/* Gắn nút Kiểm tra / Xem đáp án cho một khối có ô data-ans */
function answerBar(id, opts={}){
  return `<div class="ans-bar" data-for="${id}">
    ${opts.noCheck ? '' : `<button class="btn btn-dark" data-act="check">✔ Kiểm tra</button>`}
    <button class="btn btn-ghost" data-act="show">👁 ${opts.label || 'Xem đáp án'}</button>
    ${opts.noCheck ? '' : `<button class="btn btn-ghost" data-act="reset">↺ Làm lại</button>`}
    <span class="score"></span>
  </div>`;
}
function wireAnswerBars(root){
  $$('.ans-bar', root).forEach(bar=>{
    const box = document.getElementById(bar.dataset.for);
    const score = $('.score', bar);
    const inputs = () => $$('input[data-ans], select[data-ans]', box);
    const hint = box.querySelector('.hint-box');
    bar.addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act;
      if(!act) return;
      if(act === 'check'){
        let ok = 0, n = 0;
        inputs().forEach(inp=>{
          n++;
          inp.classList.remove('correct','wrong','shown');
          if(!inp.value.trim()) return;
          const good = inp.dataset.ans.split('|').some(a=>norm(a) === norm(inp.value));
          inp.classList.add(good ? 'correct' : 'wrong');
          if(good) ok++;
        });
        if(box._check){ const r = box._check(); ok += r[0]; n += r[1]; }
        score.textContent = `Đúng ${ok}/${n}`;
        score.classList.toggle('good', ok === n && n > 0);
      }
      if(act === 'show'){
        inputs().forEach(inp=>{
          if(!inp.classList.contains('correct')){
            inp.value = inp.dataset.ans.split('|')[0];
            inp.classList.remove('wrong'); inp.classList.add('shown');
          }
        });
        if(box._show) box._show();
        if(hint) hint.classList.add('open');
        updateBank(box);
      }
      if(act === 'reset'){
        inputs().forEach(inp=>{ inp.value=''; inp.classList.remove('correct','wrong','shown'); });
        if(box._reset) box._reset();
        if(hint) hint.classList.remove('open');
        score.textContent = ''; score.classList.remove('good');
        updateBank(box);
      }
    });
  });
}
function updateBank(box){
  const bank = box.querySelector('.word-bank');
  if(!bank) return;
  const vals = $$('input[data-ans], select[data-ans]', box).map(i=>norm(i.value));
  $$('span', bank).forEach(s=> s.classList.toggle('used', vals.includes(s.textContent)));
}

function hintBox(title, items, isList=true){
  if(!items) return '';
  return `<div class="hint-box"><div class="lbl">${title}</div>${
    isList ? `<ol class="hanzi">${items.map(i=>`<li>${i}</li>`).join('')}</ol>` : items
  }</div>`;
}

const VOCAB_MAP = {};
LESSON.vocab.forEach(v=> [v.hz, ...(v.match||[])].forEach(k=> VOCAB_MAP[k] = v));
function highlight(text){
  const words = [...Object.keys(VOCAB_MAP), ...(LESSON.text.noHighlight||[])].sort((a,b)=>b.length-a.length);
  let out = '', i = 0;
  while(i < text.length){
    const w = words.find(w=> text.startsWith(w, i));
    if(w){
      out += VOCAB_MAP[w] && !(LESSON.text.noHighlight||[]).includes(w) ? `<span class="nw" data-w="${w}">${w}</span>` : w;
      i += w.length;
    } else { out += esc(text[i]); i++; }
  }
  return out;
}

    <div class="card"><div class="tbl-wrap">${collo}</div></div>
    <div class="part-title"><span class="hanzi">（三）词语辨析</span><span class="vi">Phân biệt từ ngữ</span></div>
    <div class="card"><div class="g-title"><span class="gno">≠</span><span class="hanzi">${c.a}—${c.b}</span>${c.note?`<span class="py">${c.note}</span>`:""}</div><div class="tbl-wrap">${cmp}</div></div>
    <div class="card" id="cmpEx">
      <div class="instr"><span class="no">✎</span><div class="hanzi">做一做：选词填空<span class="vi">Chọn từ điền vào chỗ trống — tích ✓ vào (các) từ dùng được. Có câu dùng được cả hai.</span></div></div>
      <div class="tbl-wrap">${choose}</div>
      ${answerBar('cmpEx')}
    </div>`;

  const box = $('#cmpEx');
  $$('.chk:not(.locked)', box).forEach(b=> b.addEventListener('click', ()=>{
    b.classList.remove('ok','bad','miss');
    b.classList.toggle('on'); b.textContent = b.classList.contains('on') ? '✓' : '';
  }));
  const rows = () => $$('tr[data-ans]:not([data-example])', box);
  box._check = ()=>{
    let ok = 0;
    rows().forEach(tr=>{
      const ans = tr.dataset.ans; let rowOk = true;
      $$('.chk', tr).forEach(b=>{
        const want = ans[b.dataset.k] === '1', on = b.classList.contains('on');
        b.classList.remove('ok','bad','miss');
        if(on && want) b.classList.add('ok');
        else if(on && !want){ b.classList.add('bad'); rowOk = false; }
        else if(!on && want){ rowOk = false; }
      });
      if(rowOk) ok++;
    });
    return [ok, rows().length];
  };
  box._show = ()=>{
    rows().forEach(tr=>{
      $$('.chk', tr).forEach(b=>{
        const want = tr.dataset.ans[b.dataset.k] === '1';
        b.classList.remove('bad','miss');
        if(want){ b.classList.add('on'); b.textContent='✓'; if(!b.classList.contains('ok')) b.classList.add('miss'); }
        else { b.classList.remove('on','ok'); b.textContent=''; }
      });
    });
  };
  box._reset = ()=> rows().forEach(tr=> $$('.chk', tr).forEach(b=>{ b.className='chk'; b.textContent=''; }));
})();

/* ================= 5. BÀI TẬP ================= */
(function renderExercises(){
  const e1 = LESSON.ex1;
  const e2 = LESSON.ex2.map((q,i)=>`<li class="hanzi" data-ans="${q.ans}">
      ${q.zh.replace(/____/g,'<span class="opt-blank">&nbsp;</span>')}
      <span class="opt-row">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${'AB'[k]}</b>${o}</button>`).join('')}</span>
    </li>`).join('');
  const E3 = LESSON.ex3, e3Match = !Array.isArray(E3) && E3.type === 'match';
  const e3Head = e3Match
    ? `<div class="hanzi">画线连接可以搭配的词语<span class="vi">Nối các từ có thể kết hợp với nhau — chọn từ ở cột phải cho mỗi từ ở cột trái</span></div>`
    : `<div class="hanzi">给括号里的词选择适当的位置<span class="vi">Chọn vị trí thích hợp cho từ trong ngoặc — bấm vào chữ cái A, B, C hoặc D</span></div>`;
  const e3Body = e3Match
    ? `<div class="match-grid">${E3.groups.map((g,gi)=>`<div class="match-group hanzi"><div class="gt">（${gi+1}）</div>${
        Object.entries(g.ans).map(([l,r])=>{
          const ex = l === g.example;
          return `<div class="match-row ${ex?'example':''}"><span class="l">${l}</span><span class="ln"></span>
            <select class="fill-blank" ${ex ? 'disabled' : `data-ans="${r}"`}>${ex ? `<option>${r}</option>` : `<option value="">— chọn —</option>${g.right.map(o=>`<option>${o}</option>`).join('')}`}</select>${ex?' <span class="key">(mẫu)</span>':''}</div>`;
        }).join('')}</div>`).join('')}</div>`
    : `<ol class="q-list">${(Array.isArray(E3)?E3:[]).map(q=>`<li data-ans="${q.ans}">
      <div class="pos-sent hanzi">${q.zh.replace(/\[([A-D])\]/g, (m,l)=>`<button class="pos-btn" data-l="${l}">${l}</button>`)}<span class="pos-word">（${q.word}）</span></div>
      <div class="pos-fix hanzi">→ ${q.fixed}</div>

  const e4 = LESSON.ex4.rows.map(r=>`<tr>
      <td class="who hanzi">${r.who}<span class="vi">${r.whoVi}</span></td>
      <td class="kw hanzi">${r.kw.map(k=>`<span class="chip">${k}</span>`).join('')}</td>

    </tr>`).join('');

  $('#panel-baitap').innerHTML = `
    ${head('练习', '练习', 'Bài tập củng cố từ vựng và ngữ pháp của bài.', '练习')}
    <div class="card" id="ex1">
      <div class="instr"><span class="no">1</span><div class="hanzi">选择合适的词语填空<span class="vi">Chọn từ thích hợp điền vào chỗ trống</span></div></div>
      <div class="word-bank hanzi">${e1.bank.map(w=>`<span>${w}</span>`).join('')}</div>
      <ol class="q-list hanzi">${e1.items.map(it=>`<li>${fill(it)}</li>`).join('')}</ol>
      ${answerBar('ex1')}
    </div>
    <div class="card" id="ex2">
      <div class="instr"><span class="no">2</span><div class="hanzi">选择正确答案<span class="vi">Chọn đáp án đúng</span></div></div>
      <ol class="q-list">${e2}</ol>
      ${answerBar('ex2')}
    </div>
    <div class="card" id="ex3">
      <div class="instr"><span class="no">3</span>${e3Head}</div>
      ${e3Body}
      ${answerBar('ex3')}
    </div>
    <div class="card" id="ex4">
      <div class="instr"><span class="no">4</span><div class="hanzi">根据下面的提示词复述课文内容<span class="vi">Dựa vào các từ gợi ý dưới đây, thuật lại nội dung bài khóa</span></div></div>
      <table class="retell">
        <tr><td class="who hanzi" style="background:none">内容提示<span class="vi">Gợi ý nội dung</span></td><td class="kw hanzi" style="background:none">重点词语<span class="vi" style="display:block;font-size:12px;color:var(--ink-soft)">Từ trọng điểm</span></td><td class="ta hanzi" style="background:none;font-weight:700">课文复述<span class="vi" style="display:block;font-size:12px;color:var(--ink-soft);font-weight:500">Thuật lại bài khóa</span></td></tr>
        ${e4}
      </table>
      ${hintBox('Bài thuật lại mẫu', LESSON.ex4.hint)}
      ${answerBar('ex4', {noCheck:true, label:'Xem bài mẫu'})}
    </div>`;

  $('#ex1').addEventListener('input', ()=> updateBank($('#ex1')));

  /* bài 2: chọn A/B */
  const b2 = $('#ex2');
  $$('li', b2).forEach(li=>{
    $$('.opt', li).forEach(o=> o.addEventListener('click', ()=>{
      $$('.opt', li).forEach(x=>x.classList.remove('correct','wrong','reveal'));
      li.dataset.pick = o.dataset.k;
      const good = o.dataset.k === li.dataset.ans;
      o.classList.add(good ? 'correct' : 'wrong');
      $$('.opt-blank', li).forEach(x=> x.textContent = o.textContent.slice(1));
    }));
  });
  b2._check = ()=> [$$('li', b2).filter(li=>li.dataset.pick === li.dataset.ans).length, 0];
  b2._show = ()=> $$('li', b2).forEach(li=>{

    $$('.opt-blank', li).forEach(x=> x.textContent = right.textContent.slice(1));
  });
  b2._reset = ()=> $$('li', b2).forEach(li=>{ delete li.dataset.pick; $$('.opt', li).forEach(x=>x.classList.remove('correct','wrong','reveal')); $$('.opt-blank', li).forEach(x=> x.innerHTML='&nbsp;'); });
  // tổng số câu cho bài 2 & 3 (không có ô input) => sửa lại mẫu số
  b2._check = (f=>()=>{ const r=f(); return [r[0], $$('li', b2).length]; })(b2._check);

  /* bài 3: chọn vị trí (dạng nối từ dùng <select>, chấm tự động) */
  const b3 = $('#ex3');
  if(!e3Match){
  $$('li', b3).forEach(li=>{
    $$('.pos-btn', li).forEach(btn=> btn.addEventListener('click', ()=>{
      $$('.pos-btn', li).forEach(x=>x.classList.remove('correct','wrong','reveal'));

      const good = btn.dataset.l === li.dataset.ans;
      btn.classList.add(good ? 'correct' : 'wrong');
      $('.pos-fix', li).classList.toggle('open', good);
    }));
  });
  b3._check = ()=> [$$('li', b3).filter(li=>li.dataset.pick === li.dataset.ans).length, $$('li', b3).length];
  b3._show = ()=> $$('li', b3).forEach(li=>{
    const right = $(`.pos-btn[data-l="${li.dataset.ans}"]`, li);
    if(!right.classList.contains('correct')) right.classList.add('reveal');
    $('.pos-fix', li).classList.add('open');
  });
  b3._reset = ()=> $$('li', b3).forEach(li=>{ delete li.dataset.pick; $$('.pos-btn', li).forEach(x=>x.classList.remove('correct','wrong','reveal')); $('.pos-fix', li).classList.remove('open'); });
  }
})();

function openTab(tab){
  if(!$('#panel-'+tab)) tab = 'khoidong';
  $$('.ctab').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  $$('.panel').forEach(p=>p.classList.toggle('active', p.id === 'panel-'+tab));
  pop.classList.remove('open');
}
$$('.ctab').forEach(btn=> btn.addEventListener('click', ()=>{ openTab(btn.dataset.tab); history.replaceState(null,'','#'+btn.dataset.tab); }));
openTab(location.hash.slice(1));

/* ================= AUDIO TỪNG TỪ ================= */
let curAudio = null;
function playWord(hz, btn){
  $$('.audio-btn.playing').forEach(b=>b.classList.remove('playing'));
  if(curAudio){ curAudio.pause(); curAudio = null; }
  const a = new Audio(`${AUDIO_DIR}/${encodeURIComponent(hz)}.mp3`);
  curAudio = a;
  if(btn) btn.classList.add('playing');
  const done = ()=> btn && btn.classList.remove('playing');
  a.addEventListener('ended', done);
  a.addEventListener('error', ()=>{ done(); console.warn('Chưa có file audio cho:', hz); });
  a.play().catch(done);
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.audio-btn');
  if(!btn) return;
  e.stopPropagation();
  playWord(btn.dataset.hz, btn);
});

/* ================= NÉT VIẾT (GIF) ================= */
const overlay = $('#strokeOverlay'), writerRow = $('#writerRow');
function openStroke(hz, py){
  $('#strokeWord').textContent = hz;
  $('#strokePy').textContent = py;
  writerRow.innerHTML = '';
  [...hz].forEach(ch=>{
    const box = document.createElement('div');
    box.className = 'writer-box';
    const img = document.createElement('img');
    img.alt = ch; img.dataset.ch = ch;
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit';
    img.src = `${STROKE_DIR}/${encodeURIComponent(ch)}.gif`;
    img.onerror = ()=>{ box.innerHTML = `<div class="hanzi" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:34px;color:#C3C9CE;">${ch}</div>`; };
    box.appendChild(img);
    writerRow.appendChild(box);
  });
  overlay.classList.add('open');
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.stroke-btn');
  if(btn){ e.stopPropagation(); openStroke(btn.dataset.hz, btn.dataset.py); }
});
$('#strokeReplay').addEventListener('click', ()=> $$('img', writerRow).forEach(img=> img.src = `${STROKE_DIR}/${encodeURIComponent(img.dataset.ch)}.gif?t=${Date.now()}`));
['#strokeClose','#strokeClose2'].forEach(s=> $(s).addEventListener('click', ()=> overlay.classList.remove('open')));
overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.classList.remove('open'); });
</script>
